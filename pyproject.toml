[project]
name = "satlynk"
version = "0.1.0"
description = "SatLynk — LEO Satellite Constellation Task Scheduling Simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]
solver = [
    "ortools>=9.6",
]
rl = [
    "gymnasium>=0.29",
    "stable-baselines3>=2.0",
]
orbit = [
    "sgp4>=2.22",
    "skyfield>=1.46",
]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.15",
]
all = ["satlynk[dev,solver,orbit,viz,rl]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["satlynk*"]

[tool.pytest.ini_options]
testpaths = ["satlynk/tests"]
